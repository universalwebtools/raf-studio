</style></head><body><div class="me"><div class="bar"><div><b>RAF.studio — RESPONSIVE 8.8.9</b><div class="hint">Mockup możesz powiększyć. Panele możesz odczepić i przenieść na drugi monitor.</div></div><div class="devices"><button data-device="desktop">🖥 PC</button><button data-device="tablet">▰ Tablet</button><button data-device="mobile">▯ Telefon</button></div><div class="zoomCtl" title="Rozmiar mockupu"><button id="zoomMinus">−</button><input id="zoomRange" type="range" min="65" max="180" step="5" value="100"><span id="zoomValue">100%</span><button id="zoomPlus">＋</button><button id="zoomAuto">AUTO</button></div><div class="actions"><button id="detachPanels">⧉ Odczep panele</button><button id="rot">↻ Obróć</button><button id="reload">Odśwież</button><a class="admin" href="/admin/">← Admin</a></div></div><div class="stage"><div class="deviceSlot" id="deviceSlot"><div class="device" id="device"><iframe id="frame" title="Edytor responsywny"></iframe></div></div><aside class="editorRack810"><section class="rackCard810"><h2 class="rackTitle810">NARZĘDZIA EDYTORA</h2><div class="rackBody810" id="mobileToolbarHost"></div><div class="rackWait810" id="mobileBridgeWait">Łączenie z edytorem…</div></section><section class="rackCard810" id="mobilePanelCard" hidden><h2 class="rackTitle810">WŁAŚCIWOŚCI ZAZNACZONEGO ELEMENTU</h2><div class="rackBody810" id="mobilePanelHost"></div></section></aside></div></div><script>
const LATEST='8.8.9',LATEST_BUILD='8890',q=new URLSearchParams(location.search),box=document.getElementById('device'),slot=document.getElementById('deviceSlot'),frame=document.getElementById('frame'),zoomRange=document.getElementById('zoomRange'),zoomValue=document.getElementById('zoomValue'),detachBtn=document.getElementById('detachPanels');
let device=['tablet','mobile'].includes(q.get('device'))?q.get('device'):'mobile',currentVersion=q.get('ev')||LATEST,currentBuild=q.get('_editorBuild')||LATEST_BUILD,panelsWindow=null,scaleMode=localStorage.getItem('rafMockScale876')||'auto',scale=1;
if(q.get('archive')!=='1'&&currentVersion!==LATEST){currentVersion=LATEST;currentBuild=LATEST_BUILD;const u=new URL(location.href);u.searchParams.set('ev',LATEST);u.searchParams.set('_editorBuild',LATEST_BUILD);u.searchParams.delete('archive');history.replaceState(null,'',u)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function editorUrl(extra={}){const u=new URL('/',location.origin);u.searchParams.set('editor','direct');u.searchParams.set('ev',currentVersion);u.searchParams.set('_editorBuild',currentBuild);Object.entries(extra).forEach(([k,v])=>u.searchParams.set(k,v));return u.toString()}
function natural(){const land=box.classList.contains('land');if(device==='tablet')return land?{w:1024,h:768}:{w:768,h:1024};return land?{w:844,h:390}:{w:390,h:844}}
function setScale(next,saveMode=true){scale=clamp(Number(next)||1,.65,1.8);const n=natural();box.style.transform=`scale(${scale})`;slot.style.width=Math.round(n.w*scale+20)+'px';slot.style.height=Math.round(n.h*scale+20)+'px';zoomRange.value=String(Math.round(scale*100));zoomValue.textContent=Math.round(scale*100)+'%';if(saveMode){scaleMode=String(scale);localStorage.setItem('rafMockScale876',scaleMode)}}
function fitScale(){const n=natural(),barH=document.querySelector('.bar').offsetHeight||70,detached=document.body.classList.contains('panelsDetached'),side=!detached&&((device==='mobile'&&innerWidth>=860)||(device==='tablet'&&innerWidth>=1260)),reserve=side?464:0,availW=Math.max(260,innerWidth-reserve-48),availH=Math.max(360,innerHeight-barH-38),max=device==='mobile'?1.7:1.22,min=device==='mobile'?.7:.55;setScale(clamp(Math.min(availW/(n.w+20),availH/(n.h+20)),min,max),false);zoomValue.textContent='AUTO '+Math.round(scale*100)+'%'}
function applyScaleMode(){if(scaleMode==='auto')fitScale();else setScale(Number(scaleMode),false)}

function attach(fromPopout=false){document.body.classList.remove('panelsDetached');detachBtn.textContent='⧉ Odczep panele';if(!fromPopout&&panelsWindow&&!panelsWindow.closed)panelsWindow.close();panelsWindow=null;requestAnimationFrame(applyScaleMode)}
function detach(){if(panelsWindow&&!panelsWindow.closed){panelsWindow.focus();return}panelsWindow=window.open('/mobile-editor-panels.html','rafStudioPanels889','popup=yes,width=540,height=1050,resizable=yes,scrollbars=yes');if(!panelsWindow){alert('Przeglądarka zablokowała nowe okno. Zezwól na wyskakujące okna dla raf-studio.pl i spróbuj ponownie.');return}document.body.classList.add('panelsDetached');detachBtn.textContent='↩ Przyczep panele';requestAnimationFrame(applyScaleMode)}
function notifyClosed(){setTimeout(()=>{if(!panelsWindow||panelsWindow.closed)attach(true)},60)}
window.rafMobileDock876={attach,detach,notifyClosed};
frame.addEventListener('load',()=>{try{const u=new URL(frame.contentWindow.location.href),v=u.searchParams.get('ev'),b=u.searchParams.get('_editorBuild');if(v){currentVersion=v;currentBuild=b||currentBuild;const outer=new URL(location.href);outer.searchParams.set('ev',currentVersion);outer.searchParams.set('_editorBuild',currentBuild);if(v!==LATEST)outer.searchParams.set('archive','1');else outer.searchParams.delete('archive');history.replaceState(null,'',outer)}}catch{}});
document.querySelectorAll('[data-device]').forEach(x=>x.onclick=()=>load(x.dataset.device));document.getElementById('rot').onclick=()=>{box.classList.toggle('land');requestAnimationFrame(applyScaleMode)};document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();detachBtn.onclick=()=>document.body.classList.contains('panelsDetached')?attach():detach();zoomRange.oninput=()=>setScale(Number(zoomRange.value)/100);document.getElementById('zoomMinus').onclick=()=>setScale(scale-.05);document.getElementById('zoomPlus').onclick=()=>setScale(scale+.05);document.getElementById('zoomAuto').onclick=setAuto;addEventListener('resize',()=>{if(scaleMode==='auto')fitScale()},{passive:true});setInterval(()=>{if(document.body.classList.contains('panelsDetached')&&panelsWindow?.closed)attach(true)},700);addEventListener('beforeunload',()=>{try{panelsWindow?.close()}catch{}});load(device);
</script><script src="/mobile-editor-bridge-v876.js?v=8.8.9"></script></body></html>
