<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAF.studio — Edytor responsywny</title><style>
html,body{margin:0;background:#0a0a0c;color:#fff;font-family:system-ui;height:100%}.me{height:100%;display:grid;grid-template-rows:68px 1fr}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff18;background:#111;gap:10px}.bar b{font-size:14px}.bar .actions,.devices{display:flex;gap:5px;align-items:center}.bar a,.bar button{border:1px solid #ffffff22;background:#1a1a1d;color:#fff;border-radius:9px;padding:8px 10px;text-decoration:none;cursor:pointer}.devices{padding:3px;border:1px solid #ffffff18;border-radius:10px;background:#070708}.devices button{border:0;padding:6px 9px;color:#888;background:transparent}.devices button.active{background:#fff;color:#111}.stage{overflow:auto;display:grid;place-items:start center;padding:18px}.device{--w:390px;--h:844px;width:var(--w);height:var(--h);background:#000;border:10px solid #222;border-radius:30px;overflow:hidden;box-shadow:0 24px 80px #000c;position:relative;transition:width .2s,height .2s}.device[data-device="tablet"]{--w:768px;--h:1024px;border-radius:22px}.device.land{width:var(--h);height:var(--w)}.device iframe{width:100%;height:100%;border:0;background:#050505}.hint{font-size:10px;color:#888;max-width:560px;line-height:1.3}@media(max-width:900px){.hint{display:none}}@media(max-width:540px){.stage{padding:0}.device,.device[data-device="tablet"]{width:100vw;height:calc(100vh - 68px);border:0;border-radius:0}.bar{padding:0 6px}.bar b{display:none}.bar a,.bar button{padding:7px 8px}.actions .admin{display:none}}
</style></head><body><div class="me"><div class="bar"><div><b>RAF.studio — RESPONSIVE 7.6.0</b><div class="hint">Jeden projekt, osobne korekty responsywne dla tabletu i telefonu.</div></div><div class="devices"><button data-device="desktop">🖥 PC</button><button data-device="tablet">▰ Tablet</button><button data-device="mobile">▯ Telefon</button></div><div class="actions"><button id="rot">↻ Obróć</button><button id="reload">Odśwież</button><a class="admin" href="admin.html">← Admin</a></div></div><div class="stage"><div class="device" id="device"><iframe id="frame" title="Edytor responsywny"></iframe></div></div></div><script>
const q=new URLSearchParams(location.search),box=document.getElementById('device'),frame=document.getElementById('frame');let device=['tablet','mobile'].includes(q.get('device'))?q.get('device'):'mobile';
function load(next){if(next==='desktop'){location.href='edytorstrony.html';return}device=next;box.dataset.device=device;box.classList.remove('land');document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x.dataset.device===device));frame.src='index.html?editor=direct&ev=7.6.0&device='+device+'&embedded=1&_editorBuild=760';const u=new URL(location.href);u.searchParams.set('device',device);history.replaceState(null,'',u)}
document.querySelectorAll('[data-device]').forEach(x=>x.onclick=()=>load(x.dataset.device));document.getElementById('rot').onclick=()=>box.classList.toggle('land');document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();load(device);
</script></body></html>
