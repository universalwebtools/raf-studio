<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realizacja — RAF.studio</title><link rel="stylesheet" href="styles.css"></head><body><div data-raf-nav></div><main><section class="caseHero wrap"><div class="eyebrow" id="caseType">REALIZACJA</div><h1 id="caseTitle">REALIZACJA.</h1><div class="caseIntro"><p id="caseText">Każda realizacja może mieć własną stronę, opis, galerię i film.</p><p>To jest szablon case study. Później możesz mieć osobny link np. dla konkretnego ślubu albo kampanii reklamowej.</p></div><div class="actions"><button class="btn" id="caseAction">Otwórz materiał</button></div><div class="caseImage"><img id="caseImg"></div></section></main><div data-raf-footer></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search),type=q.get('type')||'photo',id=q.get('id');const c=rafCfg(),arr=type==='film'?c.film:c.photo,item=arr.find(x=>x.id===id)||arr[0];caseTitle.textContent=item.title.toUpperCase()+'.';caseType.textContent=`RAF.studio / ${type==='film'?'Film':'Fotografia'} / ${item.cat}`;caseImg.src=item.img;caseText.textContent=`${item.title} — przykład osobnej strony realizacji z opisem projektu, wybranymi kadrami oraz materiałem końcowym.`;caseAction.onclick=()=>type==='film'?openVideo(item):openViewer(arr,item.id)})</script></body></html>
