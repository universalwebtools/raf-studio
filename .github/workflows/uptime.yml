name: RAF Studio - uptime monitor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public pages
        id: health
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for url in \
            'https://raf-studio.pl/' \
            'https://raf-studio.pl/fotografia/' \
            'https://raf-studio.pl/film/'
          do
            code="$(curl --location --silent --show-error --output /dev/null --retry 2 --max-time 25 --write-out '%{http_code}' "$url")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
      - name: Create or update outage issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ALARM: raf-studio.pl nie odpowiada prawidłowo';
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'uptime'});
            const existing = open.data.find(x => x.title === title);
            const body = `Automatyczny monitoring wykrył błąd ${new Date().toISOString()}. Sprawdź stronę główną, /fotografia/ i /film/ oraz ostatnie wdrożenie GitHub Pages.`;
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['uptime']});
      - name: Fail workflow when site is down
        if: steps.health.outcome == 'failure'
        run: exit 1
