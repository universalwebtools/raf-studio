cinema:['showreel','cases','process','quote','journal','services','contact'],wedding:['story','gallery','quote','packages','journal','faq','contact'],documentary:['journal','gallery','quote','process','areas','contact'],luxury:['story','gallery','services','quote','clients','contact'],grid:['gallery','categories','services','numbers','faq','contact'],motion:['showreel','reels','cases','process','clients','contact'],magazine:['story','editorial','journal','gallery','quote','contact'],minimal:['statement','gallery','services','faq','areas','contact'],darkroom:['gallery','awards','quote','journal','contact'],studio:['services','beforeafter','cases','clients','process','contact'],analog:['story','gallery','journal','quote','contact'],monochrome:['gallery','statement','awards','quote','contact'],split:['services','showreel','gallery','faq','contact'],gallery:['gallery','gallery2','quote','journal','contact'],social:['reels','showreel','services','clients','contact'],architecture:['editorial','beforeafter','gallery','services','contact'],portrait:['story','portraits','services','quote','contact'],filmstrip:['showreel','process','journal','cases','contact'],agency:['services','cases','clients','process','contact'],fullscreen:['gallery','statement','gallery2','contact']};function block(type,i){const a=seed(`${type}-${i}a`),b=seed(`${type}-${i}b`),c=seed(`${type}-${i}c`);if(type==='gallery'||type==='gallery2'||type==='portraits'||type==='reels')return `<section class="section"><div class="tiny">SELECTED WORK</div><h2>${type==='reels'?'REELS / VERTICAL':'WYBRANE HISTORIE'}</h2><div class="band"><div class="pic"><img src="${a}"></div><div class="pic"><img src="${b}"></div><div class="pic"><img src="${c}"></div><div class="pic"><img src="${seed(type+i+'d')}"></div></div></section>`;if(type==='showreel')return `<section class="section"><div class="tiny">SHOWREEL / 2026</div><div class="pic" style="min-height:360px"><img src="${a}"><h2 style="position:absolute;left:28px;bottom:16 ss="card">Kiedy dostanę materiał?</div><div class="card">Gdzie pracujesz?</div><div class="card">Foto czy film?</div></div></section>`;return `<section class="section"><div class="form"><div><div class="tiny">KONTAKT</div><h2>ZRÓBMY COŚ DOBREGO.</h2><p>Opowiedz krótko o swoim projekcie.</p></div><div class="fields"><div class="field"></div><div class="field"></div><div class="field big"></div><div class="field big" style="height:48px;background:${ac}"></div></div></div></section>`}const flow=sectionSets[family]||sectionSets.cinema;document.querySelector('#page').className=cls;document.querySelector('#page').style.setProperty('--accent',ac);document.querySelector('#page').innerHTML=`<nav class="nav"><div class="logo">RAF.studio</div><div class="links"><span>Portfolio</span><span>Oferta</span><span>O mnie</span><span>Kontakt</span></div></nav><header class="hero"><img src="${seed('hero')}"><div class="copy"><div class="tiny">${p.name}</div><h1>${p.hero}</h1><p>${p.tag}. Pełny szablon strony fotograficznej / filmowej.</p><span class="pill">ZOBACZ REALIZACJE →</span></div></header><div class="sticky"><span>Realizacje</span><span>Oferta</span><span>Proces</span><span>Historie</span><span>Kontakt</span></div>${flow.map(block).join('')}<footer class="footer"><b>RAF.studio</b><span>Fotografia • Film • Bielsko-Biała</span></footer>`;function fit(){const page=document.querySelector('#page'),stage=document.querySelector('#stage');page.style.transform='none';const h=page.scrollHeight,w=1120,s=Math.min(stage.clientWidth/w,stage.clientHeight/h);page.style.transform=`scale(${s})`;page.style.left=`${Math.max(0,(stage.clientWidth-w*s)/2)}px`}setTimeout(fit,100);setTimeout(fit,700);window.addEventListener('resize',fit);</script></body></html>
